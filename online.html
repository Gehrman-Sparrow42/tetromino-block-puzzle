<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#17252c" />
    <title>Afterblock · Survival</title>
  </head>
  <body>
    <main id="app">
      <header>
        <h1>Survival</h1>
        <span id="connection" role="status">Connecting…</span
        ><button id="retry" hidden>Retry</button>
      </header>
      <p id="error" role="alert" hidden></p>
      <form id="lobby">
        <label
          >Name<input
            id="name"
            maxlength="24"
            autocomplete="nickname"
            value="Player"
            required
        /></label>
        <div class="join">
          <label
            >Room code<input
              id="code"
              maxlength="6"
              autocapitalize="characters"
              autocomplete="off"
              spellcheck="false"
              placeholder="ABC234" /></label
          ><button id="join" type="submit">Join</button
          ><button id="create" type="button">Create</button>
        </div>
      </form>
      <section id="room" hidden>
        <div class="room-line">
          <strong id="room-code"></strong><span id="players"></span
          ><button id="ready">Ready</button><button id="leave">Leave</button>
        </div>
        <p id="phase" role="status"></p>
      </section>
      <section class="arena" aria-label="Game boards">
        <aside>
          <span class="label">Hold</span
          ><canvas
            id="hold"
            width="96"
            height="64"
            aria-label="Held piece"
          ></canvas
          ><span class="label">Next</span
          ><canvas
            id="next"
            width="96"
            height="64"
            aria-label="Next piece"
          ></canvas
          ><span class="label">Score</span><strong id="score">0</strong
          ><span class="label">Lines</span><strong id="lines">0</strong>
        </aside>
        <canvas
          id="board"
          width="300"
          height="600"
          aria-label="Your board"
        ></canvas>
        <aside>
          <span id="opponent-name" class="label">Opponent</span
          ><canvas
            id="opponent"
            width="100"
            height="200"
            aria-label="Opponent board"
          ></canvas
          ><span id="opponent-score" class="label"></span>
        </aside>
      </section>
      <section class="controls" aria-label="Game controls">
        <div class="movement">
          <button data-action="MOVE_LEFT" aria-label="Move left">←</button
          ><button data-action="SOFT_DROP" aria-label="Soft drop">↓</button
          ><button data-action="MOVE_RIGHT" aria-label="Move right">→</button>
        </div>
        <div class="actions">
          <button data-action="ROTATE_CCW" aria-label="Rotate counterclockwise">
            ↺</button
          ><button data-action="ROTATE_CW" aria-label="Rotate clockwise">
            ↻</button
          ><button data-action="HARD_DROP">Drop</button
          ><button data-action="HOLD">Hold</button>
        </div>
      </section>
      <p class="keyboard">
        ← ↓ → move · ↑ / X rotate · Z reverse · Space drop · C hold
      </p>
    </main>
    <script type="module" src="/src/online/playtest.ts"></script>
  </body>
</html>
